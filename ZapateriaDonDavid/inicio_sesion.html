<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Zapatería Don David</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f5efe6] text-stone-800 font-sans min-h-screen flex flex-col justify-center">

    <!-- Contenedor principal ampliado (max-w-xl en lugar de max-w-md) -->
    <main class="mx-auto flex w-full max-w-xl flex-col justify-center space-y-6 p-6 py-10">

        <!-- Encabezado -->
        <header class="text-center space-y-2">
            <span class="text-3xl md:text-4xl font-bold tracking-widest text-amber-900">ZAPATERÍA DON DAVID</span>
            <p class="text-xs md:text-sm text-stone-500 uppercase tracking-wider font-semibold">Inventario, ventas y apartados de sucursales</p>
        </header>

        <!-- Tarjeta de inicio de sesión con más espacio interior (p-8) -->
        <section class="relative rounded-2xl border border-[#e3d6c0] bg-white p-8 md:p-10 shadow-md space-y-6">

            <div class="pointer-events-none absolute inset-3 rounded-xl border border-dashed border-[#d9c9ad]"></div>

            <div class="relative space-y-5">

                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-amber-900">Iniciar sesión</h1>
                    <p class="mt-1 text-sm md:text-base text-stone-500">Entra con tu usuario y contraseña para acceder al sistema</p>
                </div>

                <!-- Mensaje de error (quita "hidden" cuando el backend lo necesite) -->
                <p id="mensajeError" role="alert"
                    class="hidden rounded-lg border border-red-300 bg-red-50 p-3 text-sm text-red-700 font-medium">
                    Usuario o contraseña incorrectos.
                </p>

                <!-- Formulario -->
                <form id="formLogin" class="space-y-5" novalidate>
                    <div>
                        <label for="usuario" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1.5">Correo o usuario</label>
                        <input id="usuario" name="usuario" type="text" autocomplete="username"
                            placeholder="Ej. vendedor1" 
                            class="w-full rounded-xl border border-[#d9c9ad] bg-white px-4 py-3 text-base text-stone-800 placeholder-stone-400 outline-none transition focus:border-amber-700 focus:ring-2 focus:ring-amber-200">
                    </div>

                    <div>
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1.5">Contraseña</label>
                        <div class="relative">
                            <input id="password" name="password" type="password" autocomplete="current-password"
                                placeholder="••••••••"
                                class="w-full rounded-xl border border-[#d9c9ad] bg-white px-4 py-3 text-base text-stone-800 placeholder-stone-400 outline-none transition focus:border-amber-700 focus:ring-2 focus:ring-amber-200 pr-24">
                            <button type="button" id="verPassword" aria-pressed="false"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-amber-800 hover:text-amber-950 focus:outline-none transition uppercase tracking-wider">
                                Mostrar
                            </button>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full rounded-xl bg-amber-800 px-6 py-3.5 text-base font-semibold text-white shadow transition hover:bg-amber-900 active:bg-amber-950 focus:outline-none focus:ring-2 focus:ring-amber-300">
                        Iniciar sesión
                    </button>
                </form>

                <p class="text-xs md:text-sm text-stone-500 text-center pt-2">
                    ¿Olvidaste tu contraseña? Pide al administrador que la restablezca.
                </p>
            </div>
        </section>

    </main>

    <script>
        // Mostrar u ocultar la contraseña
        const campo = document.getElementById('password');
        const boton = document.getElementById('verPassword');

        boton.addEventListener('click', () => {
            const visible = campo.type === 'text';
            campo.type = visible ? 'password' : 'text';
            boton.textContent = visible ? 'Mostrar' : 'Ocultar';
            boton.setAttribute('aria-pressed', String(!visible));
        });

        // Solo diseño: evita que el formulario recargue la página
        document.getElementById('formLogin').addEventListener('submit', (e) => e.preventDefault());
    </script>
</body>
</html>
